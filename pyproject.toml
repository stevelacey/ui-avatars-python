[project]
name = "ui-avatars"
version = "1.2.1"
description = "Deterministic avatar URLs: Gravatar photos with a colorful initials fallback."
authors = [{ name = "Steve Lacey", email = "steve@steve.ly" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4.0"
keywords = ["avatar", "gravatar", "libravatar", "initials", "placeholder", "ui-avatars"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["tailwind_colors>=1.4.1,<2.0.0"]

[project.urls]
Homepage = "https://github.com/stevelacey/ui-avatars-python"
Repository = "https://github.com/stevelacey/ui-avatars-python"
Issues = "https://github.com/stevelacey/ui-avatars-python/issues"

[tool.poetry]
packages = [{ include = "ui_avatars", from = "src" }]

[tool.poetry.group.lint.dependencies]
ruff = "*"

[tool.poetry.group.test.dependencies]
pytest = "^9.0"
pytest-cov = "^5.0"
pytest-randomly = "^4.1.0"

[tool.pytest.ini_options]
addopts = [
    "--cov=ui_avatars",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--strict-markers",
]
python_files = ["tests.py", "*_tests.py"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "S", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["ui_avatars"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
